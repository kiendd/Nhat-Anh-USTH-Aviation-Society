# Override cho môi trường local — mở cổng ra host để dùng từ trình duyệt / công cụ ngoài.
# MySQL đã nằm trong docker-compose.yml chính nên không cần khai báo lại.
#
# Dùng kèm file chính:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Yêu cầu: network dùng chung phải tồn tại (mặc định kien_webnet):
#   docker network create kien_webnet

services:

  mysql:
    ports:
      # Mở ra host để kết nối bằng công cụ ngoài (tùy chọn)
      - "${MYSQL_HOST_PORT:-3307}:3306"

  backend:
    environment:
      # Local truy cập qua cổng host, không qua nginx
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    # !override: thay hẳn ports của file chính (loopback) thay vì nối thêm,
    # tránh bind cổng 8090 hai lần.
    ports: !override
      - "${HOST_PORT:-8090}:8090"
