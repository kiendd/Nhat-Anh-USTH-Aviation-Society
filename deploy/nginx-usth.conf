# Nginx config cho subdomain usth.laviehanoi.com
#
# Deploy trên server:
#   sudo cp deploy/nginx-usth.conf /etc/nginx/user_conf.d/usth.laviehanoi.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Yêu cầu: container backend tên `web_usth` nằm trong cùng network với nginx,
#          và nginx resolve được tên container (Docker DNS).

server {
    listen 80;
    listen [::]:80;
    server_name usth.laviehanoi.com;

    # Nếu SSL do Cloudflare đảm nhiệm: bỏ qua redirect bên dưới và để Cloudflare
    # chuyển HTTP -> HTTPS. Nếu không dùng Cloudflare, bỏ comment để ép HTTPS.
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;   # khớp spring.servlet.multipart.max-request-size

    location / {
        proxy_pass http://web_usth:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

# HTTPS — dùng khi nginx tự phục vụ SSL (cert Let's Encrypt hoặc Cloudflare Origin).
