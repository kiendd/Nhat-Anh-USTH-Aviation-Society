# Nginx config cho usth.laviehanoi.com
# Cloudflare SSL mode: Full-strict — origin phục vụ HTTPS bằng Cloudflare Origin Certificate.
#
# Dùng chung cert Origin (đã phủ *.laviehanoi.com) và Authenticated Origin Pulls
# với laviehanoi.com. Nginx chạy trong container `web_nginx` (Docker Compose, network
# dùng chung với `web_usth`), nên các file dưới đây phải được MOUNT vào container:
#   /etc/ssl/cloudflare/laviehanoi.com.pem      Origin Certificate
#   /etc/ssl/cloudflare/laviehanoi.com.key      Private key
#   /etc/ssl/cloudflare/origin-pull-ca.pem      Cloudflare Origin Pull CA
# (service nginx cần có volume: /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro)
#
# Deploy:
#   cp deploy/usth.laviehanoi.com.conf <thư-mục-Web>/nginx/user_conf.d/usth.laviehanoi.com.conf
#   docker compose up -d nginx && docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# Yêu cầu: `web_nginx` và `web_usth` cùng một Docker network
#          (tên thật xem bằng `docker network ls`, khai báo trong .env qua WEB_NETWORK).
#
# Không khai báo `geo $cloudflare_ip` ở đây: biến đó đã có trong config của
# laviehanoi.com, khai báo hai lần làm `nginx -t` báo duplicate variable.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name usth.laviehanoi.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name usth.laviehanoi.com;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/cloudflare/laviehanoi.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/laviehanoi.com.key;

    # Only allow connections from Cloudflare (blocks direct-to-IP access)
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Restore real visitor IP from Cloudflare header
    real_ip_header    CF-Connecting-IP;
    set_real_ip_from  0.0.0.0/0;

    client_max_body_size 10M;   # khớp spring.servlet.multipart.max-request-size

    # Resolve `web_usth` lúc có request (qua DNS nội bộ của Docker) thay vì lúc nginx
    # khởi động. Nếu backend USTH down, nginx vẫn chạy và chỉ trả 502 cho site này,
    # không làm sập các site khác trong cùng container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy toàn bộ tới Spring Boot (kể cả /uploads/** — file nằm trong volume
    # `uploads-data` của container, không có thư mục trên host để alias).
    location / {
        set                $usth_upstream http://web_usth:8090;
        proxy_pass         $usth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_redirect     off;
    }
}
