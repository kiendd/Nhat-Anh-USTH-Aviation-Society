<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý bài đăng quản trị - USTH</title>

    <link rel="stylesheet" href="quanlybaivietadmin.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="navbar">

        <div class="navbar-left">

            <img src="logo.png" alt="USTH">

            <div class="title">
                QUẢN LÝ BÀI ĐĂNG QUẢN TRỊ
            </div>

        </div>

        <div class="user-area">

            <span id="adminName">
                ADMIN
            </span>

            <button
                class="logout"
                onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>

                ĐĂNG XUẤT

            </button>

        </div>

    </div>

    <div class="container-admin">

        <div class="page-header">

            <div>

                <h1>

                    <i class="bi bi-file-earmark-richtext-fill"></i>

                    QUẢN LÝ BÀI ĐĂNG QUẢN TRỊ

                </h1>

                <p>

                    Quản lý các bài đăng do quản trị viên tạo.

                </p>

            </div>

            <div class="total-post">

                <span id="totalPost">
                    0
                </span>

                <small>
                    BÀI ĐĂNG
                </small>

            </div>

        </div>

        <div class="toolbar">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm kiếm bài đăng...">

            </div>

            <select id="categoryFilter">

                <option value="ALL">
                    TẤT CẢ
                </option>

                <option value="meme">
                    MEME
                </option>

                <option value="kiến thức">
                    KIẾN THỨC
                </option>

                <option value="tin tức">
                    TIN TỨC
                </option>

            </select>

            <button
                class="refresh"
                onclick="loadPosts()">

                <i class="bi bi-arrow-clockwise"></i>

                LÀM MỚI

            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>TIÊU ĐỀ</th>

                        <th>THỂ LOẠI</th>

                        <th>NGƯỜI ĐĂNG</th>

                        <th>NỘI DUNG</th>

                        <th>ẢNH</th>

                        <th>PDF</th>

                        <th>NGÀY ĐĂNG</th>

                        <th>THAO TÁC</th>

                    </tr>

                </thead>

                <tbody id="postTable">

                    <tr>

                        <td
                            colspan="9"
                            class="loading">

                            <i class="bi bi-hourglass-split"></i>

                            Đang tải bài đăng...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div id="message"></div>

        <button
            class="back"
            onclick="window.location.href='admin.html'">

            <i class="bi bi-arrow-left"></i>

            QUAY LẠI QUẢN TRỊ

        </button>

    </div>

    <script src="quanlybaivietadmin.js"></script>

</body>

</html>
