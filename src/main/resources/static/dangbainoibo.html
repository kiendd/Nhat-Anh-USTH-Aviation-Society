
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ĐĂNG BÀI NỘI BỘ - UAS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: "Tektur", sans-serif;
            background: #020817;
            color: white;
        }

        body {
            padding-top: 100px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 5px;
            width: 99.4%;
            height: 80px;
            padding: 15px 60px;
            background: rgba(0, 15, 40, .75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(241, 255, 87, .25);
            z-index: 9999;
        }

        .navbar-brand img {
            width: 120px;
            height: auto;
        }

        .navbar-nav {
            gap: 12px;
        }

        .nav-link {
            color: white !important;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px !important;
            transition: .3s;
        }

        .nav-link:hover {
            color: #F1FF57 !important;
            text-shadow: 0 0 10px rgba(241, 255, 87, .7);
        }

        .page-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto 80px;
        }

        .page-title {
            text-align: center;
            color: #F1FF57;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 0 18px rgba(241, 255, 87, .35);
        }

        .page-description {
            text-align: center;
            color: #9ba8c2;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .post-box {
            background: rgba(7, 21, 47, .92);
            border: 1px solid rgba(241, 255, 87, .22);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .3);
        }

        .form-label {
            color: #F1FF57;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .form-control,
        .form-select {
            background: rgba(2, 8, 23, .9);
            border: 1px solid rgba(255, 255, 255, .14);
            color: white;
            border-radius: 10px;
            padding: 13px 15px;
            font-family: "Tektur", sans-serif;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(2, 8, 23, .95);
            color: white;
            border-color: #F1FF57;
            box-shadow: 0 0 12px rgba(241, 255, 87, .18);
        }

        .form-control::placeholder {
            color: #65718a;
        }

        .form-select option {
            background: #07152f;
            color: white;
        }

        textarea.form-control {
            min-height: 300px;
            resize: vertical;
        }

        .category-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            background: rgba(2, 8, 23, .9);
            border: 1px solid rgba(241, 255, 87, .3);
            border-radius: 10px;
            color: #F1FF57;
            font-weight: 600;
        }

        .category-box i {
            font-size: 18px;
        }

        .image-preview {
            display: none;
            margin-top: 15px;
            max-width: 100%;
            max-height: 350px;
            border-radius: 12px;
            border: 1px solid rgba(241, 255, 87, .3);
            object-fit: contain;
            background: #020817;
        }

        .button-area {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-back {
            padding: 12px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .2);
            background: transparent;
            color: white;
            font-family: "Tektur", sans-serif;
            transition: .3s;
        }

        .btn-back:hover {
            border-color: #F1FF57;
            color: #F1FF57;
        }

        .btn-submit {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            background: #F1FF57;
            color: #020817;
            font-family: "Tektur", sans-serif;
            font-weight: 800;
            transition: .3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(241, 255, 87, .45);
        }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: rgba(25, 135, 84, .15);
            border: 1px solid rgba(25, 135, 84, .5);
            color: #75e6ad;
        }

        .message.error {
            display: block;
            background: rgba(220, 53, 69, .15);
            border: 1px solid rgba(220, 53, 69, .5);
            color: #ff8d99;
        }

        .required {
            color: #ff6b6b;
        }

        @media (max-width: 900px) {
            .navbar {
                padding: 15px 25px;
            }

            .page-container {
                width: 94%;
            }

            .post-box {
                padding: 25px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 90px;
            }

            .navbar {
                height: auto;
                min-height: 70px;
            }

            .navbar-brand img {
                width: 95px;
            }

            .page-title {
                font-size: 28px;
            }

            .button-area {
                flex-direction: column;
            }

            .btn-back,
            .btn-submit {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="home.html">
            <img src="images/logo.png" alt="UAS">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="home.html">TRANG CHỦ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="introduce.html">GIỚI THIỆU</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="hoatdong.html">HOẠT ĐỘNG</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gopy.html">GÓP Ý</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="diendanuas.html">DIỄN ĐÀN UAS</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<main class="page-container">

    <h1 class="page-title">ĐĂNG BÀI NỘI BỘ</h1>

    <p class="page-description">
        Chia sẻ thông tin và nội dung dành riêng cho thành viên UAS
    </p>

    <div class="post-box">

        <form id="postForm">

            <div class="mb-4">
                <label class="form-label">
                    TIÊU ĐỀ <span class="required">*</span>
                </label>

                <input
                        type="text"
                        id="tieuDe"
                        name="tieuDe"
                        class="form-control"
                        placeholder="Nhập tiêu đề bài viết..."
                        maxlength="255"
                        required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    THỂ LOẠI
                </label>

                <div class="category-box">
                    <i class="bi bi-lock-fill"></i>
                    <span>Nội bộ</span>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    NỘI DUNG <span class="required">*</span>
                </label>

                <textarea
                        id="noiDung"
                        name="noiDung"
                        class="form-control"
                        placeholder="Nhập nội dung bài viết..."
                        required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    ẢNH MINH HỌA
                </label>

                <input
                        type="file"
                        id="anh"
                        name="anh"
                        class="form-control"
                        accept="image/*">

                <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Ảnh xem trước">
            </div>

            <div id="message" class="message"></div>

            <div class="button-area">
                <button
                        type="button"
                        class="btn-back"
                        onclick="quayLai()">
                    <i class="bi bi-arrow-left"></i>
                    Quay lại
                </button>

                <button
                        type="submit"
                        id="submitBtn"
                        class="btn-submit">
                    <i class="bi bi-send-fill"></i>
                    ĐĂNG BÀI
                </button>
            </div>

        </form>

    </div>

</main>

<script>
    const API_URL = "/api/diendan/dang-bai";

    const postForm = document.getElementById("postForm");
    const imageInput = document.getElementById("anh");
    const imagePreview = document.getElementById("imagePreview");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    const token = localStorage.getItem("token");

    if (!token) {
        alert("Bạn cần đăng nhập để đăng bài nội bộ.");
        window.location.href = "login.html";
    }

    imageInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) {
            imagePreview.style.display = "none";
            imagePreview.src = "";
            return;
        }

        if (!file.type.startsWith("image/")) {
            showMessage("Vui lòng chọn file ảnh hợp lệ.", "error");
            this.value = "";
            imagePreview.style.display = "none";
            return;
        }

        const reader = new FileReader();

        reader.onload = function (e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = "block";
        };

        reader.readAsDataURL(file);
    });

    postForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const tieuDe = document.getElementById("tieuDe").value.trim();
        const noiDung = document.getElementById("noiDung").value.trim();
        const anh = imageInput.files[0];

        if (!tieuDe) {
            showMessage("Vui lòng nhập tiêu đề bài viết.", "error");
            return;
        }

        if (!noiDung) {
            showMessage("Vui lòng nhập nội dung bài viết.", "error");
            return;
        }

        const formData = new FormData();

        formData.append("tieuDe", tieuDe);
        formData.append("noiDung", noiDung);
        formData.append("theLoai", "Nội bộ");

        if (anh) {
            formData.append("anh", anh);
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
                <span class="spinner-border spinner-border-sm"></span>
                ĐANG ĐĂNG...
            `;

        hideMessage();

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                },
                body: formData
            });

            const text = await response.text();

            let data = null;

            try {
                data = text ? JSON.parse(text) : null;
            } catch (error) {
                data = null;
            }

            if (!response.ok) {
                let errorMessage = "Đăng bài thất bại.";

                if (data && data.message) {
                    errorMessage = data.message;
                } else if (text) {
                    errorMessage = text;
                }

                throw new Error(errorMessage);
            }

            showMessage(
                "Đăng bài nội bộ thành công!",
                "success"
            );

            postForm.reset();

            imagePreview.style.display = "none";
            imagePreview.src = "";

            setTimeout(function () {
                window.location.href = "noibo.html";
            }, 1000);

        } catch (error) {
            console.error(error);

            showMessage(
                error.message || "Không thể kết nối tới máy chủ.",
                "error"
            );

            submitBtn.disabled = false;

            submitBtn.innerHTML = `
                    <i class="bi bi-send-fill"></i>
                    ĐĂNG BÀI
                `;
        }
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    function hideMessage() {
        message.textContent = "";
        message.className = "message";
    }

    function quayLai() {
        window.location.href = "noibo.html";
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
