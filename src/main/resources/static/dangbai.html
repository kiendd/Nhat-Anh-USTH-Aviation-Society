<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng bài - USTH Forum</title>

    <link rel="stylesheet" href="dangbai.css">

</head>

<body>

<div class="container">

    <h1>Đăng bài diễn đàn</h1>

    <form id="postForm">

        <div class="form-group">

            <label for="title">
                Tiêu đề
            </label>

            <input
                    type="text"
                    id="title"
                    placeholder="Nhập tiêu đề bài viết..."
                    required
            >

        </div>


        <div class="form-group">

            <label for="category">
                Thể loại
            </label>

            <select id="category" required>

                <option value="">
                    -- Chọn thể loại --
                </option>

                <option value="Hỏi đáp">
                    Hỏi đáp
                </option>

                <option value="Sự kiện">
                    Sự kiện
                </option>

                <option value="Thông báo">
                    Thông báo
                </option>

                <option value="Học thuật và tài liệu">
                    Học thuật và tài liệu
                </option>

                <option value="Khác">
                    Khác
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="content">
                Nội dung
            </label>

            <textarea
                    id="content"
                    rows="12"
                    placeholder="Nhập nội dung bài viết..."
                    required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="image">
                Ảnh bài viết
            </label>

            <input
                    type="file"
                    id="image"
                    accept="image/*"
            >

            <div id="imagePreview"></div>

        </div>


        <div class="buttons">

            <button
                    type="button"
                    class="cancel"
                    onclick="history.back()"
            >
                Hủy
            </button>

            <button
                    type="submit"
                    class="submit"
            >
                Đăng bài
            </button>

        </div>

    </form>


    <p id="message"></p>

</div>

<script src="dang-bai.js"></script>

</body>

</html>
