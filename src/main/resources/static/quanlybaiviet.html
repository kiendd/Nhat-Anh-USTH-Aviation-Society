<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý bài viết - USTH</title>

    <link rel="stylesheet" href="quanlybaiviet.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


    <div class="navbar">

        <div class="navbar-left">

            <img src="logo.png" alt="USTH">

            <div class="title">
                QUẢN LÝ BÀI VIẾT
            </div>

        </div>


        <div class="user-area">

            <span id="adminName">
                ADMIN
            </span>

            <button
                class="logout"
                onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>

                ĐĂNG XUẤT

            </button>

        </div>

    </div>



    <div class="container-admin">


        <div class="page-header">

            <div>

                <h1>

                    <i class="bi bi-file-earmark-text-fill"></i>

                    QUẢN LÝ BÀI VIẾT

                </h1>


                <p>

                    Kiểm duyệt và quản lý bài viết
                    trên diễn đàn.

                </p>

            </div>


            <div class="total-post">

                <span id="totalPost">
                    0
                </span>

                <small>
                    BÀI VIẾT
                </small>

            </div>

        </div>



        <div class="toolbar">


            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm kiếm bài viết...">

            </div>



            <select id="statusFilter">

                <option value="ALL">
                    TẤT CẢ
                </option>

                <option value="PENDING">
                    CHỜ DUYỆT
                </option>

                <option value="APPROVED">
                    ĐÃ DUYỆT
                </option>

                <option value="REJECTED">
                    TỪ CHỐI
                </option>

            </select>



            <button
                class="refresh"
                onclick="loadPosts()">

                <i class="bi bi-arrow-clockwise"></i>

                LÀM MỚI

            </button>

        </div>



        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>ID</th>

                        <th>TIÊU ĐỀ</th>

                        <th>THỂ LOẠI</th>

                        <th>NGƯỜI ĐĂNG</th>

                        <th>NỘI DUNG</th>

                        <th>NGÀY ĐĂNG</th>

                        <th>TRẠNG THÁI</th>

                        <th>THAO TÁC</th>

                    </tr>

                </thead>



                <tbody id="postTable">


                    <tr>

                        <td
                            colspan="8"
                            class="loading">

                            <i class="bi bi-hourglass-split"></i>

                            Đang tải bài viết...

                        </td>

                    </tr>


                </tbody>


            </table>


        </div>



        <div id="message"></div>



        <button
            class="back"
            onclick="window.location.href='admin.html'">

            <i class="bi bi-arrow-left"></i>

            QUAY LẠI QUẢN TRỊ

        </button>


    </div>



    <script src="quanlybaiviet.js"></script>

</body>

</html>
