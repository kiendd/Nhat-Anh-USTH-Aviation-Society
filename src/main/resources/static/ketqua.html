    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background:
                    linear-gradient(
                            rgba(2, 8, 23, 0.92),

                    url("images/background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: "Tektur", sans-serif;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 5px;
            width: 99.4%;
            height: 80px;
            padding: 15px 60px;
            z-index: 9999;

            background: rgba(0, 15, 40, 0.55);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(241, 255, 87, 0.25);
        }

        .navbar-brand img {
            width: 120px;
            height: auto;
        }

        .navbar-nav {
            gap: 35px;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 600;
            transition: 0.3s;
        }

        .navbar-nav .nav-link:hover {
            color: #F1FF57 !important;
        }

        .btnlogin {
            border: 1px solid #F1FF57;
            background: transparent;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            font-family: inherit;
            transition: 0.3s;
        }

        .btnlogin:hover {
            background: #F1FF57;
            color: #020817 !important;
        }

        .btnlogout {
            margin-left: 15px;
            border: 1px solid #F1FF57;
            background: transparent;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            font-family: inherit;
            transition: 0.3s;
        }

        .btnlogout:hover {
            background: #F1FF57;
            color: #020817;
        }

        .user-area {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .search-section {
            padding-top: 130px;
            padding-bottom: 30px;
            text-align: center;
        }

        .search-title {
            color: #F1FF57;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .search-box {
            width: 90%;
            max-width: 700px;
            margin: auto;

            display: flex;
            align-items: center;

            background: rgba(7, 21, 47, 0.9);
            border: 1px solid rgba(241, 255, 87, 0.45);
            border-radius: 12px;

            padding: 5px 8px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;

            background: transparent;
            color: white;

            padding: 13px 15px;
            font-family: inherit;
            font-size: 16px;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .search-box button {
            border: none;
            background: #F1FF57;
            color: #020817;

            width: 48px;
            height: 45px;

            border-radius: 9px;

            font-size: 20px;
            transition: 0.3s;
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(241, 255, 87, 0.5);
        }

        .search-info {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .search-info span {
            color: #F1FF57;
        }

        .baiviet-container {
            width: 90%;
            max-width: 1300px;
            margin: 20px auto 70px;

            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 25px;
        }

        .baiviet-box {
            min-height: 430px;

            background:
                    linear-gradient(
                            rgba(7, 21, 47, 0.94),
                            rgba(2, 8, 23, 0.97)
                    );

            border: 1px solid rgba(241, 255, 87, 0.18);
            border-radius: 15px;

            overflow: hidden;

            transition:
                    transform 0.3s,
                    border-color 0.3s,
                    box-shadow 0.3s;

            cursor: pointer;
        }

        .baiviet-box:hover {
            transform: translateY(-7px);

            border-color: #F1FF57;

            box-shadow:
                    0 0 25px
                    rgba(241, 255, 87, 0.18);
        }

        .baiviet-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #07152f;
        }

        .baiviet-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition: transform 0.4s;
        }

        .baiviet-box:hover
        .baiviet-image img {
            transform: scale(1.05);
        }

        .baiviet-content {
            padding: 20px;
        }

        .baiviet-title {
            color: #F1FF57;

            font-size: 21px;
            font-weight: 700;

            line-height: 1.35;

            margin-bottom: 12px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .baiviet-description {
            color: rgba(255, 255, 255, 0.78);

            font-size: 14px;
            line-height: 1.6;

            min-height: 68px;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .baiviet-meta {
            margin-top: 18px;
            padding-top: 14px;

            border-top:
                    1px solid
                    rgba(255, 255, 255, 0.08);

            display: flex;
            flex-direction: column;
            gap: 6px;

            font-size: 12px;

            color:
                    rgba(255, 255, 255, 0.55);
        }

        .baiviet-user {
            color: #F1FF57;
        }

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 80px 20px;

            color:
                    rgba(255, 255, 255, 0.6);
        }

        .empty i {
            display: block;

            font-size: 60px;

            color: #F1FF57;

            margin-bottom: 20px;
        }

        .empty h3 {
            color: white;
            margin-bottom: 10px;
        }

        .pagination-area {
            display: flex;
            justify-content: center;

            margin-bottom: 70px;
        }

        .pagination {
            gap: 8px;
        }

        .page-item .page-link {
            min-width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px !important;

            background:
                    rgba(7, 21, 47, 0.9);

            border:
                    1px solid
                    rgba(241, 255, 87, 0.25);

            color: white;

            font-family: inherit;

            transition: 0.3s;
        }

        .page-item .page-link:hover {
            background: #F1FF57;
            color: #020817;
            border-color: #F1FF57;
        }

        .page-item.active .page-link {
            background: #F1FF57;
            border-color: #F1FF57;
            color: #020817;
        }

        .page-item.disabled .page-link {
            background:
                    rgba(7, 21, 47, 0.5);

            color:
                    rgba(255, 255, 255, 0.3);

            border-color:
                    rgba(255, 255, 255, 0.1);
        }

        footer {
            position: relative;

            margin-top: 30px;

            padding: 35px 20px;

            text-align: center;

            background:
                    rgba(0, 15, 40, 0.75);

            border-top:
                    1px solid
                    rgba(241, 255, 87, 0.18);
        }

        footer p {
            margin: 5px 0;

            color:
                    rgba(255, 255, 255, 0.65);

            font-size: 13px;
        }

        footer strong {
            color: #F1FF57;
        }

        @media (max-width: 992px) {

            .navbar {
                padding: 15px 25px;
            }

            .navbar-nav {
                gap: 10px;
            }

            .baiviet-container {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 768px) {

            .navbar {
                position: relative;

                width: 100%;
                left: 0;

                height: auto;
            }

            .search-section {
                padding-top: 40px;
            }

            .baiviet-container {
                grid-template-columns: 1fr;
            }

            .search-title {
                font-size: 27px;
            }

        }

    </style>

</head>

<script>

    const API_URL =
        "/api/diendan/bai-dang";

    const ITEMS_PER_PAGE = 9;

    let allPosts = [];

    let filteredPosts = [];

    let currentPage = 1;


    const authArea =
        document.getElementById("authArea");

    const token =
        localStorage.getItem("token");

    const username =
        localStorage.getItem("username");

    const role =
        localStorage.getItem("role");


    if (token && username) {

        authArea.innerHTML = `

        <span style="color: yellow;">

            <i class="bi bi-person-circle"></i>

            ${username}

        </span>

        <button
            class="btnlogout"
            onclick="logout()">

            <i class="bi bi-box-arrow-right"></i>

            ĐĂNG XUẤT

        </button>

    `;

    } else {

        authArea.innerHTML = `

        <a href="login.html">

            <button
                type="button"
                class="btnlogin">

                <i class="bi bi-door-open"></i>

                ĐĂNG NHẬP

            </button>

        </a>

    `;

    }


    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const searchInfo =
        document.getElementById("searchInfo");

    const postContainer =
        document.getElementById("postContainer");

    const pagination =
        document.getElementById("pagination");


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const keyword =
                params.get("q") || "";

            searchInput.value =
                keyword;

            loadBaiDang();

        }
    );


    async function loadBaiDang() {

        try {

            const response =
                await fetch(API_URL);

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            const data =
                await response.json();

            if (!Array.isArray(data)) {

                throw new Error(
                    "API không trả về Array"
                );

            }


            allPosts =
                data
                    .filter(function (post) {

                        return (
                            post.trangThai &&
                            post.trangThai
                                .toString()
                                .toUpperCase() ===
                            "APPROVED"
                        );

                    })
                    .sort(function (a, b) {

                        return (
                            new Date(b.ngayDang) -
                            new Date(a.ngayDang)
                        );

                    });


            timKiem();

        } catch (error) {

            console.error(
                "Lỗi khi tải bài đăng:",
                error
            );

            postContainer.innerHTML = `

            <div class="empty">

                <i class="bi bi-exclamation-triangle"></i>

                <h3>
                    Không thể tải dữ liệu
                </h3>

                <p>
                    Vui lòng kiểm tra kết nối với máy chủ.
                </p>

            </div>

        `;

        }

    }


    function timKiem() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!keyword) {

            filteredPosts =
                allPosts;

        } else {

            filteredPosts =
                allPosts.filter(function (post) {

                    const tieuDe =
                        (
                            post.tieuDe ||
                            ""
                        )
                            .toString()
                            .toLowerCase();

                    const noiDung =
                        (
                            post.noiDung ||
                            ""
                        )
                            .toString()
                            .toLowerCase();

                    const theLoai =
                        (
                            post.theLoai ||
                            ""
                        )
                            .toString()
                            .toLowerCase();

                    return (
                        tieuDe.includes(keyword) ||
                        noiDung.includes(keyword) ||
                        theLoai.includes(keyword)
                    );

                });

        }


        currentPage = 1;

        capNhatThongTin();

        renderPage();

        renderPagination();

    }


    function capNhatThongTin() {

        const keyword =
            searchInput.value.trim();


        if (!keyword) {

            searchInfo.innerHTML =
                `Hiển thị tất cả <span>${filteredPosts.length}</span> bài viết`;

            return;

        }


        searchInfo.innerHTML =
            `Tìm thấy <span>${filteredPosts.length}</span> bài viết cho từ khóa "<span>${escapeHtml(keyword)}</span>"`;

    }


    function renderPage() {

        postContainer.innerHTML = "";


        if (filteredPosts.length === 0) {

            postContainer.innerHTML = `

            <div class="empty">

                <i class="bi bi-search"></i>

                <h3>
                    Không tìm thấy bài viết
                </h3>

                <p>
                    Không có bài viết nào phù hợp với từ khóa bạn tìm kiếm.
                </p>

            </div>

        `;

            return;

        }


        const start =
            (currentPage - 1) *
            ITEMS_PER_PAGE;

        const end =
            start +
            ITEMS_PER_PAGE;

        const posts =
            filteredPosts.slice(
                start,
                end
            );


        posts.forEach(function (post) {

            const box =
                document.createElement("div");

            box.className =
                "baiviet-box";


            let imageUrl =
                post.anh || "";


            if (
                imageUrl &&
                !imageUrl.startsWith("http://") &&
                !imageUrl.startsWith("https://")
            ) {

                if (
                    !imageUrl.startsWith("/uploads/")
                ) {

                    imageUrl =
                        "/uploads/" +
                        imageUrl.replace(
                            /^\/+/,
                            ""
                        );

                }

            }


            let imageHtml = "";


            if (imageUrl) {

                imageHtml = `

                <img
                    src="${escapeHtml(imageUrl)}"
                    alt="${escapeHtml(
                    post.tieuDe ||
                    "Bài đăng"
                )}"
                    onerror="this.src='https://via.placeholder.com/1200x500/0a192f/FFEF63?text=USTH+Aviation'">

            `;

            }


            let userName =
                "Thành viên";


            if (post.user) {

                userName =
                    post.user.fullName ||
                    post.user.username ||
                    "Thành viên";

            }


            let dateText = "";


            if (post.ngayDang) {

                const date =
                    new Date(
                        post.ngayDang
                    );

                dateText =
                    date.toLocaleDateString(
                        "vi-VN"
                    ) +
                    " " +
                    date.toLocaleTimeString(
                        "vi-VN",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

            }


            box.innerHTML = `

            <div class="baiviet-image">

                ${imageHtml}

            </div>

            <div class="baiviet-content">

                <div class="baiviet-title">

                    ${escapeHtml(
                post.tieuDe ||
                "Không có tiêu đề"
            )}

                </div>

                <div class="baiviet-descriptio
