spring.application.name=usth

server.port=${SERVER_PORT:8090}

# Đứng sau reverse proxy (nginx) — đọc đúng X-Forwarded-Proto/Host/For
server.forward-headers-strategy=framework

# ===== Database (MySQL) =====
# Override bằng biến môi trường khi chạy local/CI, ví dụ:
#   DB_HOST=localhost DB_PORT=3307 DB_NAME=usth_aviation \
#   DB_USERNAME=root DB_PASSWORD=secret
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:usth_aviation}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:HAILONG_DEV}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ===== Upload =====
# Thư mục lưu file upload, tính từ thư mục chạy ứng dụng.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== JWT =====
# BẮT BUỘC đổi giá trị này khi triển khai thật (>= 32 ký tự cho HS256).
app.jwt.secret=${JWT_SECRET:USTH_Aviation_Society_Secret_Key_2026_123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
# Danh sách origin được phép gọi API, phân tách bằng dấu phẩy. "*" = cho phép tất cả.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
