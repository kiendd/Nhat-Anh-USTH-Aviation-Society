# Cấu hình chạy trên server, phục vụ qua subdomain usth.laviehanoi.com.
#
# Dùng MySQL có sẵn trên server (container `web_mysql`), KHÔNG khởi động MySQL riêng.
# Container đặt tên `web_usth` theo convention web_* để nginx proxy tới được.
#
#   docker network inspect kien_webnet >/dev/null 2>&1 || docker network create kien_webnet
#   docker compose up -d --build
#
# Chạy local kèm MySQL riêng:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_usth
    restart: unless-stopped
    environment:
      # Database — trỏ tới container MySQL có sẵn trong network.
      # DB_PORT là cổng NỘI BỘ của container MySQL (3306), không phải cổng map ra host.
      DB_HOST: ${DB_HOST:-web_mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-usth_aviation}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-HAILONG_DEV}

      # Ứng dụng
      SERVER_PORT: 8090
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://usth.laviehanoi.com}
      JWT_SECRET: ${JWT_SECRET:-USTH_Aviation_Society_Secret_Key_2026_123456789}

      # JPA
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    expose:
      # Chỉ mở trong network nội bộ; nginx proxy tới http://web_usth:8090
      - "8090"
    ports:
      # Bind vào loopback để debug trực tiếp trên server mà không lộ ra Internet.
      # Truy cập công khai đi qua nginx (usth.laviehanoi.com).
      - "127.0.0.1:${HOST_PORT:-8090}:8090"
    volumes:
      # Giữ file upload qua các lần restart
      - uploads-data:/app/uploads
    networks:
      webnet:
        # Alias để nginx proxy tới http://web_usth/
        aliases:
          - web_usth
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  # Network dùng chung với MySQL web_mysql và nginx.
  # Đổi qua biến WEB_NETWORK trong .env nếu server dùng tên khác
  # (kiểm tra bằng: docker network ls).
  webnet:
    external: true
    name: ${WEB_NETWORK:-kien_webnet}

volumes:
  uploads-data:
