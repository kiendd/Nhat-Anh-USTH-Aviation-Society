services:

  mysql:
    image: mysql:8.0
    container_name: usth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-HAILONG_DEV}
      MYSQL_DATABASE: ${DB_NAME:-usth_aviation}
    ports:
      # Mở ra host để có thể kết nối bằng công cụ ngoài (tùy chọn)
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-HAILONG_DEV}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usth-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database — host là tên service "mysql" trong mạng nội bộ compose
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-usth_aviation}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-HAILONG_DEV}

      # Ứng dụng
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-USTH_Aviation_Society_Secret_Key_2026_123456789}

      # JPA
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Giữ file upload qua các lần restart
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
  uploads-data:
